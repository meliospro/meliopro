<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="50%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#D99B00" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1D21" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <linearGradient id="roadYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#C28700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgDark)" />

  <!-- Outer ambient ring glow -->
  <circle cx="256" cy="180" r="145" fill="none" stroke="#F5B800" stroke-width="2" opacity="0.25" />

  <!-- MAIN EMBLEM: Location Pin with Taxi -->
  <g transform="translate(256, 185) scale(1.15)">
    <!-- Yellow Pin Outer Frame -->
    <path d="M 0,-130 C 72,-130 130,-72 130,0 C 130,45 100,95 0,165 C -100,95 -130,45 -130,0 C -130,-72 -72,-130 0,-130 Z" 
          fill="url(#pinYellow)" 
          stroke="#1F2127" 
          stroke-width="7" />

    <!-- Dark Inner Area of the Pin -->
    <path d="M 0,-112 C 60,-112 110,-62 110,0 C 110,38 82,82 0,140 C -82,82 -110,38 -110,0 C -110,-62 -60,-112 0,-112 Z" 
          fill="#1C1E24" />

    <!-- Winding Road inside Pin -->
    <path d="M -90,40 Q -10,0 20,-10 Q 50,-20 80,-15 L 75,5 Q 45,0 15,10 Q -40,25 -50,110 L -90,100 Z" 
          fill="url(#roadYellow)" />
    <!-- Road Dashes -->
    <path d="M -5,40 L 5,30 M -12,65 L -4,55 M -22,90 L -14,80" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linecap="round" />

    <!-- Taxi Roof Sign -->
    <g transform="translate(0, -66)">
      <path d="M -30,8 L -20,-8 L 20,-8 L 30,8 Z" fill="#F5B800" stroke="#111" stroke-width="3" />
      <text x="0" y="3" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="900" fill="#111" text-anchor="middle" letter-spacing="1">TAXI</text>
    </g>

    <!-- Sleek Car Silhouette -->
    <g transform="translate(0, -15)">
      <!-- Windshield & Roof -->
      <path d="M -48,-30 L -30,-48 L 30,-48 L 48,-30 L 64,-10 L -64,-10 Z" fill="#111317" stroke="#2D313A" stroke-width="2" />
      <path d="M -38,-28 L -24,-43 L 24,-43 L 38,-28 Z" fill="#2A2F3A" opacity="0.6" />
      <!-- Side Mirrors -->
      <ellipse cx="-66" cy="-25" rx="10" ry="6" fill="#111317" stroke="#2D313A" stroke-width="2" />
      <ellipse cx="66" cy="-25" rx="10" ry="6" fill="#111317" stroke="#2D313A" stroke-width="2" />
      <!-- Car Body Front -->
      <path d="M -68,-10 L 68,-10 L 62,18 L -62,18 Z" fill="#181B22" stroke="#333844" stroke-width="3" />
      <!-- Front Grille -->
      <path d="M -35,3 L 35,3 L 28,14 L -28,14 Z" fill="#101115" stroke="#4B5563" stroke-width="1.5" />
      <!-- Left Headlight (Glowing White) -->
      <polygon points="-60,-4 -38,-4 -44,6 -58,4" fill="#FFFFFF" filter="url(#glow)" />
      <!-- Right Headlight (Glowing White) -->
      <polygon points="60,-4 38,-4 44,6 58,4" fill="#FFFFFF" filter="url(#glow)" />
    </g>
  </g>

  <!-- TYPOGRAPHY: SAMA TAXI -->
  <!-- SAMA (Bold White with Yellow Checkers) -->
  <g transform="translate(256, 388)">
    <text x="0" y="0" 
          font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" 
          font-size="64" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="5"
          filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.8))">
      SAMA
    </text>
    <!-- Taxi Checkerboard Accent on SAMA -->
    <rect x="-32" y="-22" width="10" height="10" fill="#F5B800" rx="2" />
    <rect x="-20" y="-10" width="10" height="10" fill="#F5B800" rx="2" />
  </g>

  <!-- TAXI (Yellow with accent lines) -->
  <g transform="translate(256, 436)">
    <!-- Left Accent Line -->
    <line x1="-190" y1="-8" x2="-80" y2="-8" stroke="#F5B800" stroke-width="6" stroke-linecap="round" />
    <!-- Right Accent Line -->
    <line x1="80" y1="-8" x2="190" y2="-8" stroke="#F5B800" stroke-width="6" stroke-linecap="round" />

    <text x="0" y="0" 
          font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" 
          font-size="36" 
          font-weight="900" 
          fill="#F5B800" 
          text-anchor="middle" 
          letter-spacing="8">
      TAXI
    </text>
  </g>

  <!-- SLOGAN: Votre trajet, notre priorité -->
  <g transform="translate(256, 475)">
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', Arial, sans-serif" 
          font-size="18" 
          font-style="italic" 
          font-weight="500" 
          fill="#E5E7EB" 
          text-anchor="middle" 
          opacity="0.9" 
          letter-spacing="1">
      Votre trajet, notre priorité
    </text>
  </g>
</svg>
